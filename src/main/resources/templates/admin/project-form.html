<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Project Form</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <h1 class="mb-4">
        Project
    </h1>

    <form
        th:action="@{/admin/projects/save}"
        th:object="${project}"
        method="post">


        <input
            type="hidden"
            th:field="*{id}">


        <div class="mb-3">

            <label class="form-label">
                Project Title
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{title}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea
                class="form-control"
                rows="5"
                th:field="*{description}"
                required>
            </textarea>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Technologies
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{technologies}"
                placeholder="Java, Spring Boot, Oracle">

        </div>


        <div class="mb-3">

            <label class="form-label">
                GitHub URL
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{githubUrl}">

        </div>


        <div class="mb-3">

            <label class="form-label">
                Live Demo URL
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{liveUrl}">

        </div>


        <div class="mb-3">

            <label class="form-label">
                Image URL
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{imageUrl}">

        </div>


        <button
            type="submit"
            class="btn btn-success">

            Save Project

        </button>


        <a
            href="/admin/projects"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</body>
</html>
