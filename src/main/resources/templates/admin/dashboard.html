<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Pawan Waghmare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/admin/dashboard">

            Pawan Portfolio Admin

        </a>

        <form th:action="@{/logout}"
              method="post">

            <button
                type="submit"
                class="btn btn-outline-light">

                Logout

            </button>

        </form>

    </div>

</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-5">

        <div>

            <h1>Admin Dashboard</h1>

            <p class="text-muted">
                Manage your portfolio content
            </p>

        </div>

    </div>


    <!-- Statistics -->

    <div class="row g-4 mb-5">

        <!-- Projects -->

        <div class="col-md-6">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center p-4">

                    <h5 class="card-title">
                        Projects
                    </h5>

                    <h2
                        class="display-5"
                        th:text="${projectCount}">

                        0

                    </h2>

                    <p class="text-muted">
                        Total Projects
                    </p>

                    <a
                        href="/admin/projects"
                        class="btn btn-primary">

                        Manage Projects

                    </a>

                </div>

            </div>

        </div>


        <!-- Messages -->

        <div class="col-md-6">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center p-4">

                    <h5 class="card-title">
                        Messages
                    </h5>

                    <h2
                        class="display-5"
                        th:text="${messageCount}">

                        0

                    </h2>

                    <p class="text-muted">
                        Contact Messages
                    </p>

                    <a
                        href="/admin/messages"
                        class="btn btn-primary">

                        View Messages

                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- Quick Actions -->

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h4 class="mb-4">
                Quick Actions
            </h4>

            <div class="d-flex gap-3 flex-wrap">

                <a
                    href="/admin/projects/add"
                    class="btn btn-success">

                    + Add Project

                </a>

                <a
                    href="/admin/projects"
                    class="btn btn-primary">

                    Manage Projects

                </a>

                <a
                    href="/admin/messages"
                    class="btn btn-secondary">

                    View Messages

                </a>

            </div>

        </div>

    </div>

</div>


</body>
</html>
